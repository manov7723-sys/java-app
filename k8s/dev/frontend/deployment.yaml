apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-app-frontend
  namespace: devo2
  labels:
    app.kubernetes.io/name: java-app-frontend
    app.kubernetes.io/managed-by: deepagent
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: java-app-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: java-app-frontend
        app.kubernetes.io/managed-by: deepagent
    spec:
      containers:
        - name: java-app-frontend
          image: 400200465532.dkr.ecr.us-east-1.amazonaws.com/java-app-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 5
            timeoutSeconds: 5
          envFrom:
            - secretRef:
                name: app-db
                optional: true
            - secretRef:
                name: app-cache
                optional: true
            - secretRef:
                name: app-queue
                optional: true
            - secretRef:
                name: app-env
                optional: true
            - secretRef:
                name: app-env-frontend
                optional: true
          env:
            - name: PORT
              value: "3000"
            - name: SESSION_COOKIE_SECURE
              value: "false"
            - name: BACKEND_URL
              value: http://backend.devo2.svc.cluster.local
