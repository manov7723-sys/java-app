apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-app-backend
  namespace: devo2
  labels:
    app.kubernetes.io/name: java-app-backend
    app.kubernetes.io/managed-by: deepagent
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: java-app-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: java-app-backend
        app.kubernetes.io/managed-by: deepagent
    spec:
      containers:
        - name: java-app-backend
          image: 400200465532.dkr.ecr.us-east-1.amazonaws.com/java-app-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5432
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          # WARNING: no /health-style route was detected on this service, so
          # probes are TCP-only. A TCP-only probe passes as soon as the socket
          # accepts, even if the app returns 500 to every request. Add a
          # /health endpoint returning 200 and set probePath in deepagent.yaml
          # to upgrade these probes to httpGet.
          startupProbe:
            tcpSocket:
              port: 5432
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 5
            timeoutSeconds: 5
          envFrom:
            - secretRef:
                name: app-db
                optional: true
            - secretRef:
                name: app-cache
                optional: true
            - secretRef:
                name: app-queue
                optional: true
            - secretRef:
                name: app-env
                optional: true
            - secretRef:
                name: app-env-backend
                optional: true
          env:
            - name: PORT
              value: "5432"
            - name: FRONTEND_URL
              value: http://frontend.devo2.svc.cluster.local
