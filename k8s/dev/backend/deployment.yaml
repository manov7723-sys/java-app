apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-app-backend
  namespace: d3
  labels:
    app.kubernetes.io/name: java-app-backend
    app.kubernetes.io/managed-by: deepagent
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: java-app-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  template:
    metadata:
      annotations:
        instrumentation.opentelemetry.io/inject-java: "true"
        instrumentation.opentelemetry.io/inject-nodejs: "false"
        instrumentation.opentelemetry.io/inject-python: "false"
        instrumentation.opentelemetry.io/inject-dotnet: "false"
      labels:
        app.kubernetes.io/name: java-app-backend
        app.kubernetes.io/managed-by: deepagent
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: java-app-backend
          image: 400200465532.dkr.ecr.us-east-1.amazonaws.com/java-app-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 5
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: writable-tmp
              mountPath: /tmp
          envFrom:
            - secretRef:
                name: app-db
                optional: true
            - secretRef:
                name: app-cache
                optional: true
            - secretRef:
                name: app-queue
                optional: true
            - secretRef:
                name: app-env
                optional: true
            - secretRef:
                name: app-env-backend
                optional: true
          env:
            - name: PORT
              value: "8080"
            - name: SESSION_COOKIE_SECURE
              value: "false"
            - name: FRONTEND_URL
              value: http://frontend.d3.svc.cluster.local
      volumes:
        - name: writable-tmp
          emptyDir: {}
