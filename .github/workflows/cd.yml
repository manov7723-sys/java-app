name: CD (deploy all services)

# Runs automatically after the CI workflow ("CI (build all services)") completes successfully.
# Also supports manual dispatch for redeploying without a fresh build.
on:
  workflow_run:
    workflows: ["CI (build all services)"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  id-token: write   # required to request the OIDC token
  contents: read

jobs:
  deploy:
    name: Deploy all services
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC — no stored secrets)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::400200465532:role/gha-manov7723-sys-java-app-java-app-backend
          aws-region: us-east-1

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure cluster access (keyless)
        run: aws eks update-kubeconfig --name "deepagentdevops-dev" --region us-east-1

      - name: Ensure namespace uu9 is Active (auto-heal if stuck Terminating)
        # Three-stage self-heal — see cicd-pipeline.ts for the full rationale.
        # Stage 1: wait 60s for natural termination.
        # Stage 2: force-clear finalizers on Services + PVCs, wait 30s.
        # Stage 3: nuke the namespace's own finalizer via /finalize subresource.
        run: |
          set -eu
          NS="uu9"
          ns_phase() { kubectl get namespace "$NS" -o jsonpath='{.status.phase}' 2>/dev/null || echo ""; }
          for i in $(seq 1 30); do
            p=$(ns_phase)
            { [ -z "$p" ] || [ "$p" = "Active" ]; } && break
            echo "namespace $NS is $p — waiting for natural termination ($i/30)"
            sleep 2
          done
          p=$(ns_phase)
          if [ "$p" = "Terminating" ]; then
            echo "::warning::Namespace $NS still Terminating after 60s — auto-clearing finalizers on Services and PVCs."
            for kind in svc pvc; do
              for res in $(kubectl get "$kind" -n "$NS" -o name 2>/dev/null); do
                echo "  clearing finalizers on $res"
                kubectl patch "$res" -n "$NS" -p '{"metadata":{"finalizers":null}}' --type=merge >/dev/null 2>&1 || true
              done
            done
            for i in $(seq 1 15); do
              p=$(ns_phase)
              { [ -z "$p" ] || [ "$p" = "Active" ]; } && break
              sleep 2
            done
          fi
          p=$(ns_phase)
          if [ "$p" = "Terminating" ]; then
            echo "::warning::Namespace $NS still Terminating — force-clearing its own finalizer via /finalize subresource."
            if command -v jq >/dev/null 2>&1; then
              kubectl get namespace "$NS" -o json | jq '.spec.finalizers = []' | kubectl replace --raw "/api/v1/namespaces/$NS/finalize" -f - >/dev/null 2>&1 || true
            else
              printf '%s' '{"apiVersion":"v1","kind":"Namespace","metadata":{"name":"'"$NS"'"},"spec":{"finalizers":[]}}' | kubectl replace --raw "/api/v1/namespaces/$NS/finalize" -f - >/dev/null 2>&1 || true
            fi
            sleep 3
          fi
          p=$(ns_phase)
          [ -z "$p" ] && kubectl create namespace "$NS"
          p=$(ns_phase)
          if [ "$p" != "Active" ]; then
            echo "::error::Namespace $NS auto-heal exhausted; still $p. Ask the agent to run unstick_terminating_namespace for deep diagnosis."
            exit 1
          fi
          echo "namespace $NS is Active — proceeding with apply."

      - name: Apply backend manifests
        id: apply_backend
        # Prefer manifest.yaml — deploy_my_app writes exactly that file, and
        # applying the whole dir picks up any stale *.yaml (e.g. a
        # hand-committed service.yaml from an older scaffold) that
        # alphabetically-sorts AFTER it and silently overrides the freshly
        # generated resource (2026-08 incident). Fall back to the dir for
        # repos whose manifests are still split across multiple files.
        run: |
          if [ -f "k8s/dev/backend/manifest.yaml" ]; then
            kubectl apply -n uu9 -f "k8s/dev/backend/manifest.yaml"
          else
            # YAML ONLY. This same directory also holds facts.json (the
            # Deployment Facts written beside the manifest for caching and for
            # the diagnose step). A directory apply feeds EVERY file in it to
            # the validator, so that JSON fails with "apiVersion not set, kind
            # not set" and takes the whole apply down with it — after the real
            # manifests had already been created, which is what made it look
            # like a rollout problem (2026-09, deepjavatest frontend).
            set --
            for f in "k8s/dev/backend"/*.yaml "k8s/dev/backend"/*.yml; do
              [ -f "$f" ] && set -- "$@" -f "$f"
            done
            if [ "$#" -eq 0 ]; then
              echo "No YAML manifests found in k8s/dev/backend/" >&2
              exit 1
            fi
            kubectl apply -n uu9 "$@"
          fi

      - name: Restart backend rollout (image tag "latest" — force pods onto the new build)
        id: restart_backend
        run: kubectl rollout restart deployment/java-app-backend -n uu9

      - name: Wait for backend rollout
        id: wait_backend
        run: kubectl rollout status deployment/java-app-backend -n uu9 --timeout=360s

      - name: Diagnose backend on failed rollout
        # Runs BEFORE rollback so the job log preserves what actually went wrong
        # — the rollback undoes the state that would answer "why did it fail?".
        # Prints pods + describe + logs + events, and detects the port-mismatch
        # class (contract §5) by reading /proc/net/tcp{,6} inside the container.
        if: ${{ always() && (steps.apply_backend.outcome == 'failure' || steps.restart_backend.outcome == 'failure' || steps.wait_backend.outcome == 'failure') }}
        continue-on-error: true
        run: |
          echo "::group::pods"
          kubectl get pods -n uu9 -l app.kubernetes.io/name=java-app-backend -o wide || true
          echo "::endgroup::"
          echo "::group::describe"
          kubectl describe pods -n uu9 -l app.kubernetes.io/name=java-app-backend | tail -n 60 || true
          echo "::endgroup::"
          echo "::group::logs"
          kubectl logs -n uu9 -l app.kubernetes.io/name=java-app-backend --tail=100 --all-containers=true --prefix=true || true
          echo "::endgroup::"
          echo "::group::events"
          kubectl get events -n uu9 --sort-by=.lastTimestamp | tail -n 30 || true
          echo "::endgroup::"
          echo "::group::deployment facts (from facts.json, committed at discovery time)"
          FACTS_FILE=$(ls -1 k8s/*/backend/facts.json k8s/*/facts.json 2>/dev/null | head -n 1 || true)
          if [ -n "$FACTS_FILE" ] && [ -f "$FACTS_FILE" ]; then
            echo "reading $FACTS_FILE"
            if command -v jq >/dev/null 2>&1; then jq . "$FACTS_FILE" || cat "$FACTS_FILE"; else cat "$FACTS_FILE"; fi
          else
            echo "no facts.json found (this pipeline predates the discovery layer, or discovery failed for this service)"
          fi
          echo "::endgroup::"
          echo "::group::port-mismatch check"
          POD=$(kubectl get pods -n uu9 -l app.kubernetes.io/name=java-app-backend -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
          if [ -n "$POD" ]; then
            PROBE_PORT=$(kubectl get pod -n uu9 "$POD" -o jsonpath='{.spec.containers[0].ports[0].containerPort}' 2>/dev/null || echo "")
            LISTENING=$(kubectl exec -n uu9 "$POD" -- sh -c '
              for f in /proc/net/tcp /proc/net/tcp6; do
                [ -r "$f" ] || continue
                awk "NR>1 && \$4==\"0A\" { split(\$2,a,\":\"); print strtonum(\"0x\" a[2]) }" "$f"
              done | sort -u
            ' 2>/dev/null | tr "\n" " " || true)
            echo "probe expects port: $PROBE_PORT"
            echo "app is listening on: ${LISTENING:-(nothing — process may have exited)}"
            if [ -n "$PROBE_PORT" ] && [ -n "$LISTENING" ] && ! echo " $LISTENING " | grep -q " $PROBE_PORT "; then
              echo "::error::PORT MISMATCH — probes dial :$PROBE_PORT but the app is only listening on: $LISTENING. Set PORT env in the manifest to match the app, or update containerPort/probe ports."
            fi
          else
            echo "no pod found for label app.kubernetes.io/name=java-app-backend"
          fi
          echo "::endgroup::"

      - name: Rollback backend on failed rollout
        # Scoped to THIS service's own step outcomes (see sequentialDeploySteps
        # comment). `always()` lets the step evaluate even when the job status
        # is failure; the inner condition prevents rollback firing for a
        # service whose steps were skipped because an earlier service failed.
        # Contract §5: skip `rollout undo` on the first-ever deploy (history
        # has only one revision — there's nothing to undo to; erroring on that
        # confuses the log). We still print a clear message so the reader knows
        # the pipeline recognised a first-deploy vs. an actual failure.
        if: ${{ always() && (steps.apply_backend.outcome == 'failure' || steps.restart_backend.outcome == 'failure' || steps.wait_backend.outcome == 'failure') }}
        run: |
          REVS=$(kubectl rollout history deployment/java-app-backend -n uu9 2>/dev/null | tail -n +3 | grep -c '^' || echo 0)
          if [ "$REVS" -lt 2 ]; then
            echo "::warning::Rollout of java-app-backend failed and this is the first-ever deploy (rollout history has $REVS revision). Nothing to roll back to — leaving the failed pods in place so you can debug them."
            exit 1
          fi
          echo "::warning::Rollout of java-app-backend failed its health check — rolling back to the previous revision."
          kubectl rollout undo deployment/java-app-backend -n uu9
          kubectl rollout status deployment/java-app-backend -n uu9 --timeout=240s

      - name: Apply frontend manifests
        id: apply_frontend
        # Prefer manifest.yaml — deploy_my_app writes exactly that file, and
        # applying the whole dir picks up any stale *.yaml (e.g. a
        # hand-committed service.yaml from an older scaffold) that
        # alphabetically-sorts AFTER it and silently overrides the freshly
        # generated resource (2026-08 incident). Fall back to the dir for
        # repos whose manifests are still split across multiple files.
        run: |
          if [ -f "k8s/dev/frontend/manifest.yaml" ]; then
            kubectl apply -n uu9 -f "k8s/dev/frontend/manifest.yaml"
          else
            # YAML ONLY. This same directory also holds facts.json (the
            # Deployment Facts written beside the manifest for caching and for
            # the diagnose step). A directory apply feeds EVERY file in it to
            # the validator, so that JSON fails with "apiVersion not set, kind
            # not set" and takes the whole apply down with it — after the real
            # manifests had already been created, which is what made it look
            # like a rollout problem (2026-09, deepjavatest frontend).
            set --
            for f in "k8s/dev/frontend"/*.yaml "k8s/dev/frontend"/*.yml; do
              [ -f "$f" ] && set -- "$@" -f "$f"
            done
            if [ "$#" -eq 0 ]; then
              echo "No YAML manifests found in k8s/dev/frontend/" >&2
              exit 1
            fi
            kubectl apply -n uu9 "$@"
          fi

      - name: Restart frontend rollout (image tag "latest" — force pods onto the new build)
        id: restart_frontend
        run: kubectl rollout restart deployment/java-app-frontend -n uu9

      - name: Wait for frontend rollout
        id: wait_frontend
        run: kubectl rollout status deployment/java-app-frontend -n uu9 --timeout=360s

      - name: Diagnose frontend on failed rollout
        # Runs BEFORE rollback so the job log preserves what actually went wrong
        # — the rollback undoes the state that would answer "why did it fail?".
        # Prints pods + describe + logs + events, and detects the port-mismatch
        # class (contract §5) by reading /proc/net/tcp{,6} inside the container.
        if: ${{ always() && (steps.apply_frontend.outcome == 'failure' || steps.restart_frontend.outcome == 'failure' || steps.wait_frontend.outcome == 'failure') }}
        continue-on-error: true
        run: |
          echo "::group::pods"
          kubectl get pods -n uu9 -l app.kubernetes.io/name=java-app-frontend -o wide || true
          echo "::endgroup::"
          echo "::group::describe"
          kubectl describe pods -n uu9 -l app.kubernetes.io/name=java-app-frontend | tail -n 60 || true
          echo "::endgroup::"
          echo "::group::logs"
          kubectl logs -n uu9 -l app.kubernetes.io/name=java-app-frontend --tail=100 --all-containers=true --prefix=true || true
          echo "::endgroup::"
          echo "::group::events"
          kubectl get events -n uu9 --sort-by=.lastTimestamp | tail -n 30 || true
          echo "::endgroup::"
          echo "::group::deployment facts (from facts.json, committed at discovery time)"
          FACTS_FILE=$(ls -1 k8s/*/frontend/facts.json k8s/*/facts.json 2>/dev/null | head -n 1 || true)
          if [ -n "$FACTS_FILE" ] && [ -f "$FACTS_FILE" ]; then
            echo "reading $FACTS_FILE"
            if command -v jq >/dev/null 2>&1; then jq . "$FACTS_FILE" || cat "$FACTS_FILE"; else cat "$FACTS_FILE"; fi
          else
            echo "no facts.json found (this pipeline predates the discovery layer, or discovery failed for this service)"
          fi
          echo "::endgroup::"
          echo "::group::port-mismatch check"
          POD=$(kubectl get pods -n uu9 -l app.kubernetes.io/name=java-app-frontend -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
          if [ -n "$POD" ]; then
            PROBE_PORT=$(kubectl get pod -n uu9 "$POD" -o jsonpath='{.spec.containers[0].ports[0].containerPort}' 2>/dev/null || echo "")
            LISTENING=$(kubectl exec -n uu9 "$POD" -- sh -c '
              for f in /proc/net/tcp /proc/net/tcp6; do
                [ -r "$f" ] || continue
                awk "NR>1 && \$4==\"0A\" { split(\$2,a,\":\"); print strtonum(\"0x\" a[2]) }" "$f"
              done | sort -u
            ' 2>/dev/null | tr "\n" " " || true)
            echo "probe expects port: $PROBE_PORT"
            echo "app is listening on: ${LISTENING:-(nothing — process may have exited)}"
            if [ -n "$PROBE_PORT" ] && [ -n "$LISTENING" ] && ! echo " $LISTENING " | grep -q " $PROBE_PORT "; then
              echo "::error::PORT MISMATCH — probes dial :$PROBE_PORT but the app is only listening on: $LISTENING. Set PORT env in the manifest to match the app, or update containerPort/probe ports."
            fi
          else
            echo "no pod found for label app.kubernetes.io/name=java-app-frontend"
          fi
          echo "::endgroup::"

      - name: Rollback frontend on failed rollout
        # Scoped to THIS service's own step outcomes (see sequentialDeploySteps
        # comment). `always()` lets the step evaluate even when the job status
        # is failure; the inner condition prevents rollback firing for a
        # service whose steps were skipped because an earlier service failed.
        # Contract §5: skip `rollout undo` on the first-ever deploy (history
        # has only one revision — there's nothing to undo to; erroring on that
        # confuses the log). We still print a clear message so the reader knows
        # the pipeline recognised a first-deploy vs. an actual failure.
        if: ${{ always() && (steps.apply_frontend.outcome == 'failure' || steps.restart_frontend.outcome == 'failure' || steps.wait_frontend.outcome == 'failure') }}
        run: |
          REVS=$(kubectl rollout history deployment/java-app-frontend -n uu9 2>/dev/null | tail -n +3 | grep -c '^' || echo 0)
          if [ "$REVS" -lt 2 ]; then
            echo "::warning::Rollout of java-app-frontend failed and this is the first-ever deploy (rollout history has $REVS revision). Nothing to roll back to — leaving the failed pods in place so you can debug them."
            exit 1
          fi
          echo "::warning::Rollout of java-app-frontend failed its health check — rolling back to the previous revision."
          kubectl rollout undo deployment/java-app-frontend -n uu9
          kubectl rollout status deployment/java-app-frontend -n uu9 --timeout=240s
